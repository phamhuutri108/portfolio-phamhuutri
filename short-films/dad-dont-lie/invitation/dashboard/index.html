<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invitation Dashboard - Ba Oi, Dung Noi Doi</title>
    <meta name="description" content="Dashboard quan ly thiep moi Ba Oi, Dung Noi Doi">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="https://assets.phamhuutri.com/assets/home/favicon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="/short-films/dad-dont-lie/invitation/dashboard/dashboard.css?v=2">
</head>
<body>
    <main class="dashboard-shell">
        <section class="lock-screen" data-lock-screen>
            <div class="lock-panel">
                <p class="eyebrow">Ba Oi, Dung Noi Doi</p>
                <h1>Invitation Dashboard</h1>
                <form class="password-form" data-password-form>
                    <label for="dashboard-password">Password</label>
                    <div class="password-row">
                        <input id="dashboard-password" data-password-input type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" required>
                        <button type="submit" aria-label="Unlock dashboard">
                            <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
                        </button>
                    </div>
                    <p class="form-message" data-form-message aria-live="polite"></p>
                </form>
            </div>
        </section>

        <section class="dashboard-view" data-dashboard-view hidden>
            <header class="dashboard-header">
                <div>
                    <p class="eyebrow">Invitation Links</p>
                    <h1>Dad, Don't Lie</h1>
                    <p class="summary" data-summary></p>
                </div>
                <button class="text-button" type="button" data-lock-button>
                    <span class="material-symbols-rounded" aria-hidden="true">lock</span>
                    Lock
                </button>
            </header>

            <div class="toolbar">
                <label class="search-field">
                    <span class="material-symbols-rounded" aria-hidden="true">search</span>
                    <input data-search-input type="search" placeholder="Tim theo ten, vai tro, slug...">
                </label>
                <button class="text-button" type="button" data-copy-all>
                    <span class="material-symbols-rounded" aria-hidden="true">content_copy</span>
                    Copy all
                </button>
            </div>

            <section class="privacy-panel" aria-label="Quan ly hien thi loi nhan">
                <div>
                    <p class="eyebrow">Message privacy</p>
                    <h2>Ẩn / hiện lời nhắn thật</h2>
                    <p class="panel-note">Người chưa được tick sẽ thấy lời nhắn mẫu để test UI. Thay đổi được lưu lên D1 và áp dụng cho mọi thiết bị.</p>
                    <p class="privacy-status" data-privacy-status aria-live="polite"></p>
                </div>
                <div class="privacy-actions">
                    <button class="text-button" type="button" data-hide-all>
                        <span class="material-symbols-rounded" aria-hidden="true">visibility_off</span>
                        Ẩn tất cả
                    </button>
                    <button class="text-button" type="button" data-show-all>
                        <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                        Hiện tất cả
                    </button>
                    <button class="text-button" type="button" data-copy-visibility>
                        <span class="material-symbols-rounded" aria-hidden="true">content_copy</span>
                        Copy file
                    </button>
                    <button class="text-button" type="button" data-download-visibility>
                        <span class="material-symbols-rounded" aria-hidden="true">download</span>
                        Download file
                    </button>
                </div>
            </section>

            <section class="guest-list" data-guest-list aria-label="Danh sach link thiep moi"></section>
            <p class="empty-state" data-empty-state hidden>Khong tim thay khach moi nao.</p>
        </section>
    </main>

    <script src="/short-films/dad-dont-lie/invitation/invitation-guests.js?v=17"></script>
    <script src="/short-films/dad-dont-lie/invitation/invitation-message-visibility.js?v=1"></script>
    <script src="/short-films/dad-dont-lie/invitation/dashboard/dashboard.js?v=9"></script>
</body>
</html>
